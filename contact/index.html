<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact | RadioBRO</title>
        <link rel="stylesheet" href="../styles.css">
    </head>
    <body>
        <nav class="topbar">
            <div class="brand">RadioBRO</div>
            <div class="nav-links">
                <a href="../">Home</a>
                <a href="../about/">About</a>
                <a class="active" href="./">Contact</a>
            </div>
        </nav>

        <header class="hero contact-hero">
            <video class="hero-video" autoplay muted loop playsinline>
                <source src="../contact.mp4" type="video/mp4">
            </video>
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <p class="eyebrow">We’d love to hear from you</p>
                <h1>Contact RadioBRO.</h1>
                <h2 class="tagline">Free Online Radio Broadcasting</h2>
            </div>
        </header>

        <main class="page-shell">
            <section class="contact-grid">
                <article class="info-card">
                    <p class="section-label">Get in touch</p>
                    <h3>Let’s build something great together.</h3>
                    <p>Whether you want to ask a question, collaborate, or follow updates, we’re happy to hear from you.</p>
                </article>
                <form id="contactForm" class="contact-form-card">
                    <label>
                        <span>Your name</span>
                        <input id="name" name="name" type="text" placeholder="Enter your name" required>
                    </label>
                    <label>
                        <span>Message</span>
                        <textarea id="message" name="message" placeholder="Write your message..." required></textarea>
                    </label>
                    <button class="primary-btn" type="submit">Send Message</button>
                </form>
            </section>
        </main>

        <script>
            document.getElementById('contactForm').addEventListener('submit', function (event) {
                event.preventDefault();

                const name = document.getElementById('name').value.trim();
                const message = document.getElementById('message').value.trim();

                if (!name || !message) {
                    alert('Please fill in your name and message before sending.');
                    return;
                }

                const token = Math.floor(1000 + Math.random() * 9000);
                const recipient = 'loopworkl@outlook.com';
                const subject = encodeURIComponent('Token ' + token);
                const body = encodeURIComponent(
                    'Name: ' + name + '\n\n' +
                    'Message:\n' + message
                );

                window.location.href = 'mailto:' + recipient + '?subject=' + subject + '&body=' + body;
                this.reset();
                alert('Your email app should open with the message ready to send to loopworkl@outlook.com.');
            });
        </script>
    </body>
</html>
